name: Release (Windows installer)
on:
  push:
    branches: [claude/holzcord-app]
    paths-ignore: ['docs/**', '**.md', 'brand/**']
  workflow_dispatch:
# se chegar outra alteracao enquanto compila, so a mais nova importa
concurrency: { group: release, cancel-in-progress: true }
jobs:
  win:
    runs-on: windows-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      - name: Definir a versao automaticamente (maior que a anterior)
        shell: bash
        run: |
          cd apps/desktop
          BASE=$(node -p "require('./package.json').version.split('.').slice(0,2).join('.')")
          npm pkg set version="$BASE.${{ github.run_number }}"
          echo "Versao desta compilacao: $(node -p "require('./package.json').version")"
      - run: npm run build
      - run: npx electron-builder --win --publish never
        working-directory: apps/desktop
      - uses: actions/upload-artifact@v4
        with:
          name: Holzcord-Setup
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/latest.yml
      - name: Publicar release
        shell: bash
        env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
        run: |
          V=$(node -p "require('./apps/desktop/package.json').version")
          FILES="apps/desktop/release/*.exe apps/desktop/release/*.blockmap apps/desktop/release/latest.yml"
          gh release create "v$V" $FILES --title "Holzcord $V" --notes "Instalador Windows" --latest || gh release upload "v$V" $FILES --clobber
