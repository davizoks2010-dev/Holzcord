name: Release (Windows installer)
on:
  push: { tags: ['v*'] }
  workflow_dispatch:
jobs:
  win:
    runs-on: windows-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx electron-builder --win --publish never
        working-directory: apps/desktop
      - uses: actions/upload-artifact@v4
        with:
          name: Holzcord-Setup
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/latest.yml
      - name: Publicar release
        shell: bash
        env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
        run: |
          V=$(node -p "require('./apps/desktop/package.json').version")
          FILES="apps/desktop/release/*.exe apps/desktop/release/*.blockmap apps/desktop/release/latest.yml"
          gh release create "v$V" $FILES --title "Holzcord $V" --notes "Instalador Windows" --latest || gh release upload "v$V" $FILES --clobber
